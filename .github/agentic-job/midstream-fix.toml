# Bounds for dispatch.yml's `fix` kind on the midstream forks (#336):
# fix.toml's bounds without `ready_when_complete`, so apply never takes a
# midstream pull request out of draft; midstream.toml says why. The profile
# job of dispatch.yml passes this file as the wrapper's `fix-allow` for a
# target that midstream.toml's rule matches. Unlike midstream.toml, `repos`
# stays a list of names: the pass also reads this file (poll.yml's
# `--fix-bounds`), and agent-board's reader at its pin refuses an
# organization rule, so a fork given the topic is fixed only once it is
# named here too.
hosts = ["github.com"]
repos = ["jmarrero-forge/bootc", "jmarrero-forge/composefs-rs", "jmarrero-forge/bcvk", "jmarrero-forge/rpm-ostree", "jmarrero-forge/ostree", "jmarrero-forge/image-builder", "jmarrero-forge/osbuild"]
bases = ["main"]
max_outputs = 3
max_patch_bytes = 1048576
max_patch_files = 50
# A misled run must not change the caller's execution destinations.
protected = [".github/agentic-job/runner-profiles.json"]

[github.outputs]
# Same caller-owned CI trust decision as midstream.toml, not a default-ref bypass.
own-branch-repos = ["jmarrero-forge/*"]
# The branches and replacement as fix.toml's, whose comment says what each
# glob is for and how apply bounds the head repository: `bot/**` holds the
# staged pull requests within these forks (#710). `own_author` as fix.toml's.
push_to_pull_request_branch = { max = 1, branches = ["dispatch/**", "bot/**", "release-train/**"], replacement_max_commits = 5, own_author = "jmarrero-bot" }
add_comment = { max = 1 }
noop = { max = 1 }
missing_tool = { max = 1 }
missing_data = { max = 1 }

# The same repository-scoped workflow admission as midstream.toml, none
# yet; no protected filenames or other midstream repositories are exempted.
[unprotected_files]
repos = []
dot_folders = [".github"]
