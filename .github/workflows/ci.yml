# Checks of this repository's own automation, so a pull request that edits
# `.github/` is tested before it merges. The one job named ci is what the
# main branch ruleset requires: a new check is added to its `needs`, with
# no change to the ruleset.
name: ci

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The tests of the scripts under .github, through the Justfile.
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The hosted image's Node and Rust; the scripts have no dependencies
      # to install, and test-config's crate fetches its locked ones.
      # A pinned just: Ubuntu's apt carries an old one (1.21 on 24.04).
      # A GitHub release outage (504s for over an hour on 2026-11-08) must not
      # stop the job: build the same just from crates.io instead.
      - id: just
        continue-on-error: true
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - if: steps.just.outcome == 'failure'
        run: cargo install --locked --version 1.58.0 just && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Upstream builds the supervisor's pin; without the supervisor, the
      # one pin the workflows share, which test-pass-config and
      # test-poll-next check against.
      - name: Install the verified pinned agent-board
        env:
          GH_TOKEN: ${{ github.token }}
        run: just build-agent-board "$(just agent-board-pin)"
      # Today's policy on PATH, so just test checks the current bounds for real.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cgwalters-forge/agentic-job
          ref: 740ff7ff4dcef59dcb0619eb14d0e357c3193f62 # v0.6.15, as dispatch.yml's wrapper
          path: _dispatch-policy
          persist-credentials: false
      - name: Install the pinned policy binary by verified source digest
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REPOSITORY: cgwalters-forge/agentic-job
        run: |
          bash _dispatch-policy/secure-host/binary.sh get --out "$RUNNER_TEMP/dispatch-policy-bin"
          # Ours: the agentic_job_* config tests skip without it, silently.
          PATH="$RUNNER_TEMP/dispatch-policy-bin:$PATH" agentic-job --version
          echo "$RUNNER_TEMP/dispatch-policy-bin" >> "$GITHUB_PATH"
      # Also executed by just test-pass-state; keep script growth out of Justfile.
      - name: Test pass state export
        shell: node {0}
        run: |
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { spawnSync, execFileSync } = require('node:child_process');
          const source = /^pass-state mode:\n((?:    .*\n|\n)+)/m.exec(fs.readFileSync('Justfile', 'utf8'))[1].replace(/^    /gm, '').replace(/^#!.*\n/, '');
          const functions = {};
          new Function('require', 'process', 'exports', source)(require, { argv: ['node', 'recipe', 'test'] }, functions);
          const { publicStates, validate } = functions;
          const env = { GITHUB_RUN_ID: '42', GITHUB_REPOSITORY: 'owner/tracker', DEFAULT_BRANCH: 'main' };
          const prior = { id: 41, workflow_id: 123, path: '.github/workflows/poll.yml', head_branch: 'main',
            repository: { full_name: env.GITHUB_REPOSITORY }, head_repository: { full_name: env.GITHUB_REPOSITORY },
            event: 'workflow_dispatch', display_title: 'pass (apply)' };
          // Empty input (schedule or manual bootstrap) discovers, then revalidates,
          // exactly the same predecessor that an explicit dispatch would restore.
          for (const event of ['schedule', 'workflow_dispatch']) {
            const calls = [];
            const get = endpoint => {
              calls.push(endpoint);
              if (endpoint.includes('/runs?')) return { workflow_runs: [
                { ...prior, id: 43 }, { ...prior, id: 40 }, { ...prior, id: 42 }, { ...prior, event },
                { ...prior, id: 44, head_branch: 'other' }, { ...prior, id: 45, display_title: 'pass' }] };
              if (endpoint.endsWith('/workflows/poll.yml')) return { id: 123 };
              if (endpoint.includes('/jobs?')) return { total_count: 1, jobs: [{ name: 'pass', status: 'completed', conclusion: 'success' }] };
              assert.ok(endpoint.endsWith('/runs/41')); return { ...prior, event };
            };
            assert.equal(validate(env, get), '41');
            assert.equal(validate({ ...env, PREVIOUS_RUN_ID: '41' }, get), '41');
            assert.equal(calls.length, 7, 'discovery still runs the three exact provenance checks');
            assert.equal(validate(env, endpoint => endpoint.includes('/runs?') ? { workflow_runs: [prior] } :
              endpoint.endsWith('/workflows/poll.yml') ? { id: 999 } : prior), '', 'reject discovered untrusted workflow');
          }
          assert.equal(validate(env, () => ({ workflow_runs: [] })), '');
          assert.throws(() => validate(env, () => ({})));
          const url = path => `https://api.github.com/repos/owner/public/${path}`;
          const allowed = ['issues', 'issues?state=all&per_page=100&page=2', 'issues/1', 'pulls', 'pulls?state=open&per_page=100',
            'pulls/1', 'issues/1/comments?per_page=100&page=2', 'issues/comments/2', 'labels', 'issues/1/labels'];
          const unsafe = ['pulls/1/reviews', 'pulls/1/reviews/2', 'pulls/1/comments', 'pulls/comments/2', 'actions/runs', 'events',
            'contents/file', 'issues/1/parent', 'issues/1/sub_issues', 'issues/1/reactions', 'issues/1/comments/2', 'issues/1/timeline',
            'issues/1/timeline/extra', 'issues/1/../reviews', 'issues%2f1', 'issues/1#fragment', 'issues/1/'];
          const response = { etag: 'fixture-validator', body: 'fixture response' };
          const responses = Object.fromEntries([...allowed, ...unsafe].map(path => [url(path), response]));
          for (const key of ['https://api.github.com/user/notifications', 'https://other.example/repos/owner/public/issues',
            ...['private', 'unknown', 'mismatch', 'hidden'].map(repo => `https://api.github.com/repos/owner/${repo}/issues`)]) responses[key] = response;
          responses[url('pulls/1/reviews')] = { etag: 'pending-validator', body: [{ state: 'PENDING', body: 'unpublished review' }] };
          responses[url('issues/1/timeline')] = { etag: 'private-cross-reference', body: 'private source issue' };
          const entry = { id: 30, records: [{ body: 'Plan.\n```agent-board-plan\n{}\n```',
            url: 'https://github.com/owner/public/issues/1#issuecomment-30', author: { login: 'bot' },
            editor: null, lastEditedAt: null, createdAt: '2026-11-01T00:00:00Z' }],
            published: 'fixture-reference', prose: {}, references: { 30: 'fixture-reference' }, pulls: [], minimized: [] };
          const living = { schema: 'agent-board/status/v1', bot: 'bot', entries: { 'Owner/Public#1': entry,
            'owner/private#2': { ...entry, prose: { 'Current plan': 'private metadata' } } } };
          const metadata = endpoint => {
            if (endpoint.endsWith('/unknown')) throw new Error('API outage');
            return { full_name: endpoint.endsWith('/mismatch') ? 'other/repo' : endpoint.slice(6),
              private: endpoint.endsWith('/private'), visibility: /private|hidden/.test(endpoint) ? 'private' : 'public' };
          };
          const state = { schema: 'agent-board/poll-state/v1', interval_seconds: 300, share_cursor: 'owner/private#1',
            authored_cursor: 'owner/private', intake_waiting: { 'owner/private#2': 'fixture' }, intake_refused: ['owner/private#3/4'],
            lock_refused: { 'owner/private#5': 'fixture' }, maintain: { fixture: 'private metadata' }, future_field: 'private metadata',
            responses, pass_responses: responses };
          const calls = [];
          const exported = publicStates(state, living, endpoint => { calls.push(endpoint); return metadata(endpoint); });
          assert.deepEqual(exported.living, { ...living, entries: { 'Owner/Public#1': entry } });
          assert.deepEqual(exported.state, { schema: state.schema, interval_seconds: 300,
            responses: Object.fromEntries(allowed.map(path => [url(path), response])),
            pass_responses: Object.fromEntries(allowed.map(path => [url(path), response])) });
          assert.equal(calls.length, 5, 'one metadata check per repository across caches and ledger');
          assert.doesNotMatch(JSON.stringify(exported), /private metadata|unpublished review|pending-validator|private-cross-reference/);
          for (const bad of [{ ...living, schema: 'unknown' }, { ...living, entries: [] },
            { ...living, entries: { 'not-an-issue': entry } }, { ...living, extra: 'private metadata' }]) assert.throws(() => publicStates({}, bad, metadata));
          assert.equal(publicStates({}, null, metadata).living, null);
          const poll = fs.readFileSync('.github/workflows/poll.yml', 'utf8');
          const config = JSON.parse(fs.readFileSync('.github/pass.json', 'utf8'));
          // Ours leaves topDown, a scheduling switch, off while wip is 0.
          assert.equal(config.state, '.state/pass.json');
          assert.equal(config.livingStatus, undefined, 'do not adopt living comments without independently durable replay state');
          assert.notEqual(config.cleanupHistory, true);
          assert.match(poll, /PREVIOUS_RUN_ID: \$\{\{ inputs.previous_run_id \}\}/);
          const restore = poll.split('      - name: Restore pass state\n')[1].split('      - name: One pass\n')[0];
          assert.match(restore, /if: steps.predecessor.outputs.run-id != ''/);
          assert.match(restore, /run-id: \$\{\{ steps.predecessor.outputs.run-id \}\}/);
          assert.match(restore, /name: pass-state\n          path: .state/);
          assert.match(restore, /continue-on-error: true/);
          assert.match(restore, /if: steps.restore.outcome == 'failure'\n        run: rm -rf .state/);
          const publish = poll.split('      - name: Prepare public pass state\n')[1].split('      # GitHub drops')[0];
          // Ours gates a manual apply on PASS_APPLY too (poll.yml).
          for (const text of ["vars.PASS_APPLY == 'enabled' && (github.event_name == 'schedule' ||",
            "github.event_name == 'workflow_dispatch' && inputs.apply", "steps.state.outcome == 'success'", 'run: just pass-state export']) assert.ok(publish.includes(text));
          assert.match(publish, /path: \|\n            .state\/public\/pass.json\n            .state\/public\/living-status.json\n          include-hidden-files: true\n          retention-days: 1/);
          assert.doesNotMatch(poll, /actions\/cache@/);
          for (const action of ['download', 'upload']) assert.match(poll, new RegExp(`uses: actions/${action}-artifact@[0-9a-f]{40} # v`));
          const temp = fs.mkdtempSync(require('node:path').join(require('node:os').tmpdir(), 'pass-state-'));
          const read = path => fs.readFileSync(`${temp}/.state/${path}`, 'utf8');
          const write = (path, value) => fs.writeFileSync(`${temp}/.state/${path}`, typeof value === 'string' ? value : JSON.stringify(value));
          const run = extra => spawnSync(process.execPath, ['-e', source, 'recipe', 'export'], { cwd: temp, encoding: 'utf8',
            env: { PATH: `${temp}:${process.env.PATH}`, ...extra } });
          try {
            execFileSync('bash', ['-ec', /Prepare state directory\n        run: (.*)\n/.exec(restore)[1]], { cwd: temp });
            fs.writeFileSync(`${temp}/gh`, `#!${process.execPath}\nif(process.env.METADATA_FAIL)process.exit(1);const repo=process.argv[3].slice(6);console.log(JSON.stringify({full_name:process.env.MISMATCH?'other/repo':repo,private:repo==='owner/private',visibility:repo==='owner/private'?'private':'public'}));\n`, { mode: 0o755 });
            for (const cache of [state, null, '{private fixture', ' '.repeat(32 * 1024 * 1024 + 1)]) {
              fs.rmSync(`${temp}/.state/pass.json`, { force: true });
              if (cache !== null) write('pass.json', cache);
              write('living-status.json', living); const before = read('living-status.json');
              const got = run(); assert.equal(got.status, 0, got.stderr);
              assert.equal(read('living-status.json'), before, 'original ledger is never the filtered public copy');
              assert.deepEqual(JSON.parse(read('public/living-status.json')), exported.living);
              assert.doesNotMatch(got.stdout + got.stderr, /private fixture|private metadata|fixture-reference/);
            }
            // Both destructive paths from review, plus invalid/oversized ledger and identity mismatch.
            const overflow = { responses: Object.fromEntries(Array.from({ length: 101 }, (_, n) => [url('issues').replace('public', `repo${n}`), {}])) };
            for (const [ledger, cache, extra] of [[living, {}, { METADATA_FAIL: '1' }], [living, overflow, {}],
              [living, {}, { MISMATCH: '1' }], ['{private ledger fixture', {}, {}], [' '.repeat(4 * 1024 * 1024 + 1), {}, {}]]) {
              write('living-status.json', ledger); write('pass.json', cache); const before = read('living-status.json');
              const got = run(extra); assert.equal(got.status, 1); assert.match(got.stderr, /original ledger retained; refusing export/);
              assert.equal(read('living-status.json'), before, 'failure preserves every original ledger byte');
              assert.equal(fs.existsSync(`${temp}/.state/public`), false, 'no partial or stale public artifact on failure');
              assert.doesNotMatch(got.stdout + got.stderr, /private ledger fixture|fixture-reference|private metadata/);
            }
          } finally { fs.rmSync(temp, { recursive: true, force: true }); }
          console.log('ok trusted scheduled predecessor discovery, public-only export and non-destructive ledger failures');
      - run: just test
        env:
          AGENT_BOARD: ${{ runner.temp }}/agent-board/bin/agent-board
          # The bounds' and pass.json's organization rules read live metadata.
          GH_TOKEN: ${{ github.token }}

  # actionlint, zizmor and the runner-label policy shared by the forge
  # repositories, at the versions its `just check` recipe pins on the
  # actions repository's main, which this follows (#544); `just lint` runs
  # the same recipe locally.
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jmarrero-forge/actions/lint@main

  # The bounds, runner configuration and pools that dispatch.yml reads from
  # the default branch, and review.yml's bounds: a file that does not parse
  # fails every run after the merge.
  config:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse the JSON and TOML files of .github/agentic-job and workflow
        run: |
          python3 - .github/agentic-job/*.json .github/agentic-job/*.toml workflow/*.toml <<'PY'
          import json, sys, tomllib

          failed = False
          for path in sys.argv[1:]:
              try:
                  with open(path, "rb") as f:
                      (json if path.endswith(".json") else tomllib).load(f)
              except (OSError, ValueError) as e:
                  failed = True
                  print(f"::error file={path}::{e}")
              else:
                  print(f"ok {path}")
          sys.exit(failed)
          PY

  # The deployment code may only shrink (#890 upstream): a change fails if
  # it adds any file but a workflow, JSON, TOML, markdown or the config test
  # crate's test source and lockfile, or if it grows the line count of the
  # .cjs and .sh files, so a fix deletes at least as many lines as it adds.
  # Renames count as an add and a delete. Upstream counts its Justfile too
  # and excepts its soak script; ours has neither rule, since a resync adds
  # upstream's recipes back and the soak lane isn't copied.
  shrink:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse new scripts and growth of the .cjs and .sh files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          added=$(git diff --no-renames --diff-filter=A --name-only "$BASE" HEAD |
            grep -vE '^\.github/workflows/[^/]+\.ya?ml$|\.(json|toml|md)$|^(LICENSE(-[A-Z]+)?|COPYING)$|^\.github/agentic-job/config-test/(tests/config\.rs|Cargo\.lock)$' || true)
          if [ -n "$added" ]; then
            awk '{ print "::error::adds a script file: " $0 }' <<< "$added"
            exit 1
          fi
          growth=$(git diff --no-renames --numstat "$BASE" HEAD |
            awk -F'\t' '$3 ~ /\.(cjs|sh)$/ { n += $1 - $2 } END { print n + 0 }')
          echo "net lines added to .cjs and .sh files: $growth"
          if [ "$growth" -gt 0 ]; then
            echo "::error::grows the .cjs and .sh files by $growth lines; delete at least as many as you add"
            exit 1
          fi

  # Require only ci in the ruleset, on both PR and merge-group commits.
  ci:
    if: ${{ always() }}
    needs: [test, lint, config, shrink]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
